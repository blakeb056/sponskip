<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 300px; background: #121212; color: #f1f1f1; padding: 14px; user-select: none; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #272727; padding-bottom: 10px; margin-bottom: 12px; }
    .title { font-size: 14px; font-weight: 700; letter-spacing: 0.3px; display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    .status-dot.inactive { background: #ef4444; }

    /* uBlock style big counter box */
    .stat-card {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      margin-bottom: 12px;
    }
    .stat-number { font-size: 36px; font-weight: 800; color: #ff4d4d; line-height: 1; margin-bottom: 4px; }
    .stat-label { font-size: 11px; text-transform: uppercase; color: #888; letter-spacing: 0.8px; font-weight: 600; }
    .stat-source { font-size: 11px; color: #aaa; margin-top: 6px; }

    /* Segment list */
    .section-title { font-size: 11px; text-transform: uppercase; color: #888; font-weight: 600; margin-bottom: 6px; }
    .segments-list { max-height: 140px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .segment-item {
      background: #1e1e1e;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 3px solid #ff4d4d;
    }
    .segment-time { font-family: monospace; color: #ddd; font-weight: 600; }
    .segment-badge { font-size: 10px; background: #2a2a2a; padding: 2px 6px; border-radius: 4px; color: #bbb; }
    .empty-state { font-size: 12px; color: #666; text-align: center; padding: 12px 0; }

    /* Toggle & Actions */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a1a1a;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .btn-row { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 7px;
      background: #2563eb;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #2a2a2a; color: #ccc; }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span class="status-dot" id="statusDot"></span>
      Sponskip
    </div>
    <span style="font-size: 11px; color: #777;">v1.0.0</span>
  </div>

  <div class="stat-card">
    <div class="stat-number" id="count">0</div>
    <div class="stat-label">Sponsors Blocked on this video</div>
    <div class="stat-source" id="source">Waiting for video...</div>
  </div>

  <div class="section-title">Detected Timestamps</div>
  <div class="segments-list" id="segmentsList">
    <div class="empty-state">No sponsors detected yet</div>
  </div>

  <div class="btn-row">
    <button id="rescanBtn">Force Re-scan</button>
    <button class="secondary" id="optionsBtn">Options</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
